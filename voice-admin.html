<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S — Kukoo Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #00d4ff;
    --blue-dim: #0077aa;
    --blue-dark: #001a2e;
    --gold: #ffd700;
    --red: #ff3333;
    --green: #00ff88;
    --bg: #020b14;
    --panel: rgba(0, 30, 60, 0.85);
  }

  body {
    background: var(--bg);
    color: #c0e8ff;
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 4px;
  }
  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    color: var(--blue);
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,212,255,0.5);
  }
  .header .sub {
    font-size: 0.75rem;
    color: var(--blue-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Arc reactor mic button */
  .arc-container {
    position: relative;
    width: 120px;
    height: 120px;
    cursor: pointer;
  }
  .arc-ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid;
    animation: none;
  }
  .arc-ring-1 { inset: 0; border-color: var(--blue-dim); }
  .arc-ring-2 { inset: 8px; border-color: rgba(0,212,255,0.4); }
  .arc-ring-3 { inset: 18px; border-color: rgba(0,212,255,0.2); }
  .arc-core {
    position: absolute;
    inset: 28px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,212,255,0.15) 0%, transparent 70%);
    border: 2px solid var(--blue-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    transition: all 0.3s;
  }

  .arc-container.idle .arc-core { box-shadow: 0 0 15px rgba(0,212,255,0.3); }

  .arc-container.listening .arc-ring-1 {
    border-color: var(--blue);
    animation: spin-slow 4s linear infinite;
  }
  .arc-container.listening .arc-ring-2 {
    border-color: var(--blue);
    animation: spin-slow 3s linear infinite reverse;
  }
  .arc-container.listening .arc-core {
    background: radial-gradient(circle, rgba(0,212,255,0.4) 0%, transparent 70%);
    border-color: var(--blue);
    box-shadow: 0 0 30px rgba(0,212,255,0.6), 0 0 60px rgba(0,212,255,0.2);
  }
  .arc-container.thinking .arc-ring-1 { border-color: var(--gold); animation: spin-fast 1s linear infinite; }
  .arc-container.thinking .arc-core { border-color: var(--gold); box-shadow: 0 0 25px rgba(255,215,0,0.5); }
  .arc-container.speaking .arc-ring-1 { border-color: var(--green); animation: pulse-ring 0.8s ease-in-out infinite; }
  .arc-container.speaking .arc-core { border-color: var(--green); box-shadow: 0 0 25px rgba(0,255,136,0.5); }

  @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes spin-fast { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pulse-ring { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.7; } }

  /* Status text */
  .status-line {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--blue-dim);
    text-transform: uppercase;
    min-height: 18px;
    transition: color 0.3s;
  }
  .status-line.listening { color: var(--blue); }
  .status-line.thinking  { color: var(--gold); }
  .status-line.speaking  { color: var(--green); }

  /* Panels */
  .panel {
    width: 100%;
    background: var(--panel);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 8px;
    padding: 14px 18px;
    backdrop-filter: blur(10px);
  }
  .panel-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    color: var(--blue-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .panel-text {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #a0d8f0;
    min-height: 24px;
  }
  .panel.response-panel { border-color: rgba(0,212,255,0.35); }
  .panel.response-panel .panel-text { color: var(--blue); font-size: 1rem; }

  /* API log */
  .api-log {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: #1a5570;
    min-height: 16px;
    text-align: center;
    width: 100%;
  }

  /* Image drop zone */
  .drop-zone {
    width: 100%;
    border: 1px dashed rgba(0,212,255,0.25);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    font-size: 0.8rem;
    color: #1a5570;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0.05em;
  }
  .drop-zone.has-image { border-color: var(--green); color: var(--green); }
  .drop-zone:hover { border-color: rgba(0,212,255,0.5); }
  .drop-zone img { max-height: 80px; margin-top: 8px; border-radius: 4px; }

  /* Channel chips */
  .channels {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
  }
  .channel-chip {
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.1em;
    cursor: pointer;
    border: 1px solid rgba(0,212,255,0.2);
    background: transparent;
    color: #1a5570;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .channel-chip.active {
    background: rgba(0,212,255,0.1);
    border-color: var(--blue);
    color: var(--blue);
    box-shadow: 0 0 8px rgba(0,212,255,0.2);
  }

  /* Config panel */
  .config-panel {
    width: 100%;
    background: rgba(0,10,20,0.9);
    border: 1px solid rgba(0,212,255,0.15);
    border-radius: 8px;
    padding: 16px;
  }
  .config-panel label {
    display: block;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: var(--blue-dim);
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .config-panel input {
    width: 100%;
    background: rgba(0,212,255,0.05);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 4px;
    padding: 8px 10px;
    color: #c0e8ff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.9rem;
    margin-bottom: 10px;
    outline: none;
  }
  .config-panel input:focus { border-color: var(--blue); }
  .config-panel input[type="password"] { letter-spacing: 0.1em; }

  .save-btn {
    background: rgba(0,212,255,0.1);
    border: 1px solid var(--blue);
    color: var(--blue);
    padding: 8px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .save-btn:hover { background: rgba(0,212,255,0.2); box-shadow: 0 0 10px rgba(0,212,255,0.3); }

  .error-msg { color: var(--red); font-size: 0.8rem; min-height: 18px; text-align: center; width: 100%; }

  /* Scanline effect */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 0;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>J.A.R.V.I.S</h1>
    <div class="sub">Just A Rather Very Intelligent System · Kukoo Admin Interface</div>
  </div>

  <div class="arc-container idle" id="arcBtn">
    <div class="arc-ring arc-ring-1"></div>
    <div class="arc-ring arc-ring-2"></div>
    <div class="arc-ring arc-ring-3"></div>
    <div class="arc-core" id="arcIcon">⬡</div>
  </div>

  <div class="status-line" id="statusText">SYSTEMS STANDBY</div>

  <div class="panel">
    <div class="panel-label">Input Transcription</div>
    <div class="panel-text" id="transcriptText">—</div>
  </div>

  <div class="panel response-panel">
    <div class="panel-label">J.A.R.V.I.S Response</div>
    <div class="panel-text" id="responseText">Good day, sir. Systems are online and awaiting your command.</div>
  </div>

  <div class="api-log" id="apiLog"></div>

  <div class="drop-zone" id="dropZone">
    ▣ DROP CAMPAIGN IMAGE HERE
    <div>Banner · Instagram · WhatsApp Broadcast</div>
    <input type="file" id="imageInput" accept="image/*" style="display:none">
    <div id="imagePreview"></div>
  </div>

  <div class="channels">
    <span class="channel-chip active" data-channel="whatsapp">WhatsApp</span>
    <span class="channel-chip active" data-channel="push">Push</span>
    <span class="channel-chip" data-channel="sms">SMS</span>
    <span class="channel-chip" data-channel="email">Email</span>
  </div>

  <div class="config-panel" id="configPanel">
    <label>Admin Voice Token</label>
    <input type="password" id="voiceToken" placeholder="Bearer token from .env" autocomplete="off">
    <label>API Base URL</label>
    <input type="text" id="apiBase" value="https://staging.kukoo.in/api/admin/voice">
    <button class="save-btn" id="saveConfig">CONNECT TO JARVIS</button>
    <div id="configStatus" style="margin-top:8px;font-size:0.8rem;color:var(--blue-dim);text-align:center;"></div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

</div>

<script type="module">
import { GoogleGenAI, Modality } from 'https://esm.run/@google/genai';

// ─── CONFIG (voice token + base URL in sessionStorage; Gemini key fetched from server) ──
const CONFIG = {
  get geminiApiKey()    { return sessionStorage.getItem('jarvis_gemini_key') || ''; },
  set geminiApiKey(v)   { sessionStorage.setItem('jarvis_gemini_key', v); },
  get adminVoiceToken() { return sessionStorage.getItem('jarvis_voice_token') || ''; },
  get adminApiBase()    { return sessionStorage.getItem('jarvis_api_base') || 'https://staging.kukoo.in/api/admin/voice'; },
};

// Restore saved config
document.getElementById('voiceToken').value = CONFIG.adminVoiceToken;
document.getElementById('apiBase').value = CONFIG.adminApiBase;

document.getElementById('saveConfig').addEventListener('click', async () => {
  const token = document.getElementById('voiceToken').value.trim();
  const base  = document.getElementById('apiBase').value.trim();
  if (!token) { showError('Voice token is required, sir.'); return; }

  sessionStorage.setItem('jarvis_voice_token', token);
  sessionStorage.setItem('jarvis_api_base',    base);

  const statusEl = document.getElementById('configStatus');
  statusEl.textContent = 'Fetching Gemini key from server…';

  try {
    const res = await fetch(base + '/config', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const json = await res.json();
    if (!res.ok || !json.data?.gemini_api_key) {
      statusEl.textContent = '';
      showError(json.message || 'Could not fetch Gemini key. Check the token and API base.');
      return;
    }
    CONFIG.geminiApiKey = json.data.gemini_api_key;
    statusEl.textContent = '';
    document.getElementById('configPanel').style.display = 'none';
    showError('');
    responseEl.textContent = 'Online and ready, sir. Systems nominal.';
  } catch (e) {
    statusEl.textContent = '';
    showError('Network error reaching the server: ' + e.message);
  }
});

// ─── STATE ────────────────────────────────────────────────────────────────────
let session       = null;
let mediaStream   = null;
let audioContext  = null;
let isListening   = false;
let pendingImage  = null;
let activeChannels = ['whatsapp', 'push'];

// ─── UI REFS ──────────────────────────────────────────────────────────────────
const arcBtn       = document.getElementById('arcBtn');
const arcIcon      = document.getElementById('arcIcon');
const statusText   = document.getElementById('statusText');
const transcriptEl = document.getElementById('transcriptText');
const responseEl   = document.getElementById('responseText');
const apiLogEl     = document.getElementById('apiLog');
const errorEl      = document.getElementById('errorMsg');
const dropZone     = document.getElementById('dropZone');
const imageInput   = document.getElementById('imageInput');

function setStatus(state, text) {
  statusText.className = 'status-line ' + state;
  statusText.textContent = text;
  arcBtn.className = 'arc-container ' + (state || 'idle');
  const icons = { listening: '◉', thinking: '⟳', speaking: '◈', '': '⬡' };
  arcIcon.textContent = icons[state] ?? '⬡';
}

function logApi(method, path, ok) {
  apiLogEl.textContent = `${ok ? '✓' : '✗'} ${method} /...${path.slice(-40)}`;
}

function showError(msg) {
  errorEl.textContent = msg;
  if (msg) setTimeout(() => errorEl.textContent = '', 6000);
}

// ─── API HELPER ──────────────────────────────────────────────────────────────
async function fetchAdmin(method, path, body = null, isFormData = false) {
  const headers = { 'Authorization': `Bearer ${CONFIG.adminVoiceToken}` };
  if (!isFormData && body) headers['Content-Type'] = 'application/json';
  const opts = { method, headers };
  if (body) opts.body = isFormData ? body : JSON.stringify(body);
  const res = await fetch(CONFIG.adminApiBase + path, opts);
  logApi(method, path, res.ok);
  return res.json();
}

// ─── IMAGE DROP ZONE ─────────────────────────────────────────────────────────
dropZone.addEventListener('click', () => imageInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = 'var(--green)'; });
dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = '');
dropZone.addEventListener('drop', e => { e.preventDefault(); handleImageFile(e.dataTransfer.files[0]); });
imageInput.addEventListener('change', e => handleImageFile(e.target.files[0]));

function handleImageFile(file) {
  if (!file) return;
  pendingImage = file;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('imagePreview').innerHTML = `<img src="${e.target.result}"><br><small>IMAGE LOCKED</small>`;
    dropZone.classList.add('has-image');
  };
  reader.readAsDataURL(file);
}

// ─── CHANNEL CHIPS ───────────────────────────────────────────────────────────
document.querySelectorAll('.channel-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    chip.classList.toggle('active');
    const ch = chip.dataset.channel;
    activeChannels = activeChannels.includes(ch)
      ? activeChannels.filter(c => c !== ch)
      : [...activeChannels, ch];
  });
});

// ─── FUNCTION DECLARATIONS ───────────────────────────────────────────────────
const FUNCTION_DECLARATIONS = [
  { name: 'get_dashboard', description: "Get today's orders, revenue, pending orders, active stores", parameters: { type: 'object', properties: {} } },
  { name: 'get_earnings', description: 'Get earnings and commission for a period', parameters: { type: 'object', properties: { period: { type: 'string', enum: ['today','week','month'] } }, required: ['period'] } },
  { name: 'get_top_items', description: 'Get best selling items today', parameters: { type: 'object', properties: {} } },
  { name: 'get_store_ranking', description: 'Get stores ranked by orders today', parameters: { type: 'object', properties: {} } },
  { name: 'get_top_delivery_man', description: 'Get top delivery men today', parameters: { type: 'object', properties: {} } },
  { name: 'get_expenses', description: 'Get this month\'s expenses', parameters: { type: 'object', properties: {} } },
  { name: 'list_orders', description: 'List orders by status', parameters: { type: 'object', properties: { status: { type: 'string' } } } },
  { name: 'get_order', description: 'Get details of an order', parameters: { type: 'object', properties: { id: { type: 'integer' } }, required: ['id'] } },
  { name: 'update_order_status', description: 'Update order status', parameters: { type: 'object', properties: { id: { type: 'integer' }, status: { type: 'string' } }, required: ['id','status'] } },
  { name: 'assign_delivery_man', description: 'Assign delivery man to order', parameters: { type: 'object', properties: { id: { type: 'integer' }, delivery_man_id: { type: 'integer' } }, required: ['id','delivery_man_id'] } },
  { name: 'search_orders', description: 'Search orders by ID, name, or phone', parameters: { type: 'object', properties: { q: { type: 'string' } }, required: ['q'] } },
  { name: 'switch_order_to_cod', description: 'Switch order to cash on delivery', parameters: { type: 'object', properties: { id: { type: 'integer' } }, required: ['id'] } },
  { name: 'verify_offline_payment', description: 'Mark offline payment as verified', parameters: { type: 'object', properties: { id: { type: 'integer' } }, required: ['id'] } },
  { name: 'list_refunds', description: 'List refund requests', parameters: { type: 'object', properties: { status: { type: 'string', enum: ['pending','approved','rejected'] } } } },
  { name: 'update_refund_status', description: 'Approve or reject a refund', parameters: { type: 'object', properties: { id: { type: 'integer' }, status: { type: 'string', enum: ['approved','rejected'] } }, required: ['id','status'] } },

  { name: 'approve_delivery_man', description: 'Approve or deny delivery man application', parameters: { type: 'object', properties: { id: { type: 'integer' }, action: { type: 'string', enum: ['approved','denied'] } }, required: ['id','action'] } },

  { name: 'get_dm_payout', description: 'Get delivery man payout balance', parameters: { type: 'object', properties: { id: { type: 'integer' } }, required: ['id'] } },

// ─── FUNCTION CALL HANDLER ───────────────────────────────────────────────────

    case 'get_store_ranking':      return fetchAdmin('GET', '/reports/store-ranking');
    case 'get_top_delivery_man':   return fetchAdmin('GET', '/reports/top-dm');
    case 'get_expenses':           return fetchAdmin('GET', '/reports/expenses');
    case 'list_orders':            return fetchAdmin('GET', `/orders?status=${r.status||'pending'}`);
    case 'get_order':              return fetchAdmin('GET', `/orders/${r.id}`);

    case 'list_subscription_packages': return fetchAdmin('GET', '/subscriptions/packages');

    case 'switch_store_to_commission': return fetchAdmin('POST', `/subscriptions/stores/${r.store_id}/switch-to-commission`);

      const payload = { ...r, channels: activeChannels };
      if (pendingImage) {
        const formData = new FormData();
        formData.append('image', pendingImage);
        const uploadRes = await fetchAdmin('POST', '/campaign-launcher/upload-image', formData, true);

PERSONA RULES (non-negotiable):

// ─── GEMINI LIVE SESSION ──────────────────────────────────────────────────────
// ai is instantiated per-session so it always uses the latest fetched key
async function startSession() {
  if (!CONFIG.adminVoiceToken) {
    showError('ADMIN VOICE TOKEN NOT SET — expand config panel below');
    return;
  }
  if (!CONFIG.geminiApiKey) {
    showError('GEMINI KEY NOT LOADED — please save your voice token first');
    return;
  }
  const ai = new GoogleGenAI({ apiKey: CONFIG.geminiApiKey });

  try {
    setStatus('thinking', 'INITIALISING SYSTEMS...');
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

    session = await ai.live.connect({
      model: 'gemini-2.0-flash-live',
      config: {
        responseModalities: [Modality.AUDIO, Modality.TEXT],
        systemInstruction: SYSTEM_PROMPT,
        tools: [{ functionDeclarations: FUNCTION_DECLARATIONS }],
      },
    });

    session.on('message', async (msg) => {
      if (msg.serverContent?.modelTurn?.parts) {
        for (const part of msg.serverContent.modelTurn.parts) {
          if (part.text) {
            responseEl.textContent = part.text;
            setStatus('speaking', 'J.A.R.V.I.S SPEAKING');
          }
          if (part.functionCall) {
            setStatus('thinking', `EXECUTING ${part.functionCall.name.toUpperCase().replace(/_/g,' ')}...`);
            const result = await handleFunctionCall(part.functionCall.name, part.functionCall.args || {});
            await session.sendToolResponse({
              functionResponses: [{
                id:       part.functionCall.id,
                name:     part.functionCall.name,
                response: result,
              }]
            });
          }
        }
      }
      if (msg.serverContent?.inputTranscription?.text) {
        transcriptEl.textContent = msg.serverContent.inputTranscription.text;
      }
      if (msg.serverContent?.turnComplete) {
        setStatus('listening', 'AWAITING YOUR COMMAND, SIR');
      }
    });

    session.on('error', (err) => {
      showError('SYSTEM ERROR: ' + err.message);
      stopSession();
    });

    // Stream mic audio to Gemini (PCM 16kHz)
    audioContext = new AudioContext({ sampleRate: 16000 });
    const source = audioContext.createMediaStreamSource(mediaStream);
    const processor = audioContext.createScriptProcessor(4096, 1, 1);

    processor.onaudioprocess = (e) => {
      if (!session) return;
      const float32 = e.inputBuffer.getChannelData(0);
      const int16 = new Int16Array(float32.length);
      for (let i = 0; i < float32.length; i++) {
        int16[i] = Math.max(-32768, Math.min(32767, float32[i] * 32768));
      }
      session.sendRealtimeInput({
        audio: { data: btoa(String.fromCharCode(...new Uint8Array(int16.buffer))), mimeType: 'audio/pcm;rate=16000' }
      });
    };

    source.connect(processor);
    processor.connect(audioContext.destination);

    isListening = true;
    setStatus('listening', 'AWAITING YOUR COMMAND, SIR');
    arcIcon.textContent = '◉';

  } catch (err) {
    showError('INITIALISATION FAILED: ' + err.message);
    setStatus('', 'SYSTEMS STANDBY');
  }
}

function stopSession() {
  if (session) { try { session.close(); } catch(e) {} session = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  if (audioContext) { try { audioContext.close(); } catch(e) {} audioContext = null; }
  isListening = false;
  setStatus('', 'SYSTEMS STANDBY');
  arcIcon.textContent = '⬡';
}

arcBtn.addEventListener('click', () => {
  isListening ? stopSession() : startSession();
});

// Hide config panel if voice token already saved; Gemini key is always fetched from server
if (CONFIG.adminVoiceToken) {
  document.getElementById('configPanel').style.display = 'none';
  // Re-fetch Gemini key silently in the background on page reload
  fetch(CONFIG.adminApiBase + '/config', {
    headers: { 'Authorization': `Bearer ${CONFIG.adminVoiceToken}` }
  }).then(r => r.json()).then(json => {
    if (json.data?.gemini_api_key) {
      CONFIG.geminiApiKey = json.data.gemini_api_key;
      responseEl.textContent = 'All systems online, sir. Ready for your command.';
    } else {
      showError('Could not load Gemini key from server — check admin settings.');
    }
  }).catch(() => showError('Network error fetching Gemini config from server.'));
}
